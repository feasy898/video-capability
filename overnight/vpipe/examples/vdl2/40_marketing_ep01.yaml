    edit_ops: []
    acceptance_refs: [acc-mk06-product, acc-mk-cta]
    budget: { credit_cap_per_shot: 280, max_retries: 2 }
    notes: "M2 映射：CP3 shot_06（api_h3max）；上缘留白供 i-pp-mk-cta CTA 字牌。本线无 cp4（关键帧层），包内不设关键帧类 intent。"

# ---- 包级确定性后处理（post_comp 通道）----
post_ops:
  - intent_ref: i-pp-mk-sub             # 全片口播台词字牌：6 镜装配后统一烧录
    run_after: [shot_01, shot_02, shot_03, shot_04, shot_05, shot_06]
  - intent_ref: i-pp-mk-cta             # CTA 字牌：收尾镜后烧录
    run_after: [shot_06]

# ---- L4 验收层：执行前冻结（AcceptanceSpec 原样采用）----
acceptance:
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk01-avatar
    version: "1.0.0"
    intent_path: "i-cam-mk01.predicate"
    metric: "identity_drift_detected"
    tolerance: { evidence_status: vpo:delivery.evidence_status.prior, notes: "G9a 口播段身份一致性：数字人段与产品镜同一人物设定（cp1 must_keep），flag 级" }
    gate: vpo:delivery.gate.flag
    detector_id: J1_glm8
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk02-product
    version: "1.0.0"
    intent_path: "i-cam-mk02.predicate"
    metric: "product_geometry_drift_detected"
    tolerance: { evidence_status: vpo:delivery.evidence_status.prior }
    gate: vpo:delivery.gate.block       # G7：瓶体几何恒存，形变即打回
    detector_id: J1_glm8
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk03-reeds
