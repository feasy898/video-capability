    tolerance: { evidence_status: vpo:delivery.evidence_status.prior }
    gate: vpo:delivery.gate.block       # G7：瓶体+藤条恒存
    detector_id: J1_glm8
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk04-hand
    version: "1.0.0"
    intent_path: "i-cam-mk04.hand_object_contact"
    metric: "hand_anomaly_detected"
    tolerance: { evidence_status: vpo:delivery.evidence_status.prior }
    gate: vpo:delivery.gate.block       # G1：融指/断指即打回（短剧线 acc-hand 同构）
    detector_id: J1_glm8
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk05-scene
    version: "1.0.0"
    intent_path: "i-cam-mk05.predicate"
    metric: "product_geometry_drift_detected"
    tolerance: { evidence_status: vpo:delivery.evidence_status.prior }
    gate: vpo:delivery.gate.block       # G7：全景镜产品体量与恒存
    detector_id: J1_glm8
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk06-product
    version: "1.0.0"
    intent_path: "i-cam-mk06.predicate"
    metric: "product_geometry_drift_detected"
    tolerance: { evidence_status: vpo:delivery.evidence_status.prior }
    gate: vpo:delivery.gate.block       # G7：收尾镜瓶体恒存
    detector_id: J1_glm8
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
    criterion_id: acc-mk-sub
    version: "1.0.0"
    intent_path: "i-pp-mk-sub.ops[0]"
    metric: "subtitle_verbatim_match"
    tolerance: { evidence_status: vpo:delivery.evidence_status.prior }
    gate: vpo:delivery.gate.block       # 确定性烧录：逐字不符即拒（可仪表验收）
    detector_id: J6_detectors
    detector_version: "vpipe1.0"
  - schema: "https://vpo.example/schemas/v1/l4/acceptance-spec.schema.json"
