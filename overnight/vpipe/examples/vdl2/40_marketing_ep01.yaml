# ---- 执行计划 ----
shots:
  - schema_version: "2.0"
    shot_id: shot_01
    axis: G9a                            # 口播主体线：CP3 channel_hint=api_vidu_avatar（G9a 数字人专线）
    duration_s: 4.78                     # = CP3 shots[0].duration_s = CP2 seg_01 估时
    aspect: "9:16"
    resolution: 480P                     # avatar 实际输出 540p/720p 由客户端参数定（20 例同款登记）
    characters:
      - char_id: cast_host
        desc: "女主播，25-32 岁，邻家知性口吻"
        ref_image: "assets/marketing/cast_host_ref.png"   # image 通道身份锚（G9a：avatar 参考图即身份）
    camera: { movement: static, description: "半身近景口播机位，固定带微呼吸感" }
    audio:
      generate: true
      speech: "卧室睡不好？试试这瓶雪松香薰，无火无烟，开着就能睡。"   # = CP2 seg_01 narration_text（TTS 输入源）
      music: ""
    intent_refs: [i-cam-mk01]
    prompt_mode: compiled                # 口播镜语义全来自意图（台词段不进 prompt，avatar 通道规则）
    engine:
      channel: api_vidu_avatar           # CP10 TTS→CP9 gen_avatar 直出口播段，不经草稿层（cp1/cp3 notes）
      fallback: []                       # avatar 是唯一已验证口播通道（20 例同款）
      route_rule: G9a_avatar_talk
    continuity:
      link: none
      seed_policy: none                  # R2：api 通道禁 fix_for_iteration
      lock_restatement: [characters]
      d3_split_declared: true            # CP5 shot_01 序列 96 帧>72 窗→known_cuts[3.6]（工件实值）
      tail_source: planned
    cache:
      strategy: submit_params            # R2：API 层只命中提交参数层
      fingerprint_includes: [prompt_hash, speech_text, image_ref_sha]
    edit_ops: []
    acceptance_refs: [acc-mk01-avatar, acc-mk-sub]
    budget: { credit_cap_per_shot: 6, max_retries: 1 }   # vidu_credit 币种：1积分/s×ceil(4.78s)=5，×1.2 冗余=6（cp1.notes）
    notes: "M2 映射：CP3 shot_01→api_vidu_avatar（CP10 TTS→CP9 avatar 直出，不经草稿层）；CP5 序列 96 帧>72 窗→known_cuts[3.6]。本线 CP 面=cp1/cp2/cp3/cp5/cp6/cp7——该线无 cp4（关键帧层未进 M2 执行面），包内不设关键帧类 intent。【M2 降级登记 2026-10-09】G9a avatar 专线未实落：执行记录 out/m2/marketing_ep01/cp9/cp9_shot_01.json gate note 实录——「原路由=api_vidu_avatar……营销线口播主体参考图缺位……本镜实际通道=api_h3max……avatar 真实调用 0 次」；该镜按 no-talking-head 变体实落（产品旁白+字幕卡），本包 engine.channel/route_rule 为规格侧原声明，执行态以该 CP9 工件为准。"

  - schema_version: "2.0"
    shot_id: shot_02
    axis: G7                             # 产品恒存禁区镜（cp1 forbidden_zones G7_物体恒存）
    duration_s: 2.83
    aspect: "9:16"
    resolution: 768P
    seed: 44                             # CP7 草稿层实测登记值（API 通道 seed 零控制力，R2 口径）
    camera: { movement: push_in, description: "缓推瓶身" }
    audio:
      generate: false                    # VO 由 CP10 TTS 统一后期铺装（mk01 音频层口径），生成侧不逐镜出音
      speech: "植物精油，尾调雪松，越闻越安神。"   # = CP2 seg_02
      music: ""
    intent_refs: [i-cam-mk02]
    prompt_mode: handwritten             # 手写底稿=CP3 action 实文；intents 仅登记
    prompt: "琥珀玻璃香薰瓶特写立于实木底座，藤条呈扇形展开，镜头缓推瓶身，瓶面无可读文字元素，产品几何恒存不形变"
