# =====================================================================
# vpipe QC 阈值表（eval/thresholds.yaml）
# ---------------------------------------------------------------------
# 来源：overnight/judge基准报告.md（2026-09-30 定稿）§11「QC 体系定稿建议」，
#       阈值扫描依据 §7，误报/漏检证据 §9/§10，E10 基线数字 §6。
# 效力：qc_orch.py 的合议阈值只从这里读（SPEC.md 铁律：模块内不许出现第二套阈值）；
#       eval_run.py 的准入线从 eval_admission 段读。
# 修改规程：改本文件 = 改判定行为 → 必须重跑 eval_run.py 并在 §结论 复核，
#       结果退化时回滚（judge基准报告 §7 的扫描表是回滚依据）。
# =====================================================================
version: 4                   # 2026-10-08（v4）：末尾新增 checkpoints 段（12 CP 级 gate 参数，
                             #   逐键落实 contracts/v2/checkpoint.schema.json + examples/cp1..12.json
                             #   全部 params_ref 引用，键清单见该段头注释）；v3 段（ensemble/judges/
                             #   eval_admission/l0_preflight）一字未改——纯只增升版，J3_omnijev.thr
                             #   仍 0.71、准入线不动；run_v3_checks ALL PASS + eval ACCEPT 零偏差后
                             #   生效（逐键口径与 M2 校准计划见 evidence/thresholds/
                             #   v3-to-v4-migration.md）。
                             # 2026-10-07：judges.J3_omnijev.thr 0.70→0.71（判官数据重跑后
                             #   按 §修改规程 重扫工作点，证据见该行注记与 g01-full-relock.json）。
                             # 2026-10-01（v2）：J6_detectors_v2 增低运动平台豁免/known_cuts；
                             #   l0_preflight 增采样与 avatar 垫尾参数（工程方案v3.1 P0-1/P0-2）。
                             #   E10 合议与全部判定阈未动，eval 回归 ACCEPT 零偏差后方可生效。
source_report: overnight/judge基准报告.md (2026-09-30)

# ---------------------------------------------------------------
# 合议方案（eval_run.py 与 qc_orch.py 共同引用的判定定义）
# ---------------------------------------------------------------
ensemble:
  recommended: E10            # 推荐主判据：J1 ∨ J3@0.70（§6 调阈组合表）
  definitions:
    E9:  "J3@0.70 单独"                                        # R=1.000 FPR=0.250 F1=0.914 B_flag=0.333
    E10: "J1.detected OR J3@0.70 flag"                          # R=1.000 FPR=0.250 F1=0.914 B_flag=0.833
  measured_baseline:            # E10 在金标 40 条上的实测（golden_scores.json），eval 时用于偏差定位
    tp: 16
    fp: 3
    recall: 1.0
    fpr: 0.25
    precision: 0.8421
    f1: 0.9143
    b_flag_rate: 0.8333
    fp_clips: [golden_010, golden_025, golden_032]

# ---------------------------------------------------------------
# 各判官角色与阈值（§11.1 分层表）
# ---------------------------------------------------------------
judges:
  J1_glm8:                      # GLM-5.3-Flash 8帧 rubric
    role: review_parallel       # L1' 复核并联：∨ 进 E10；B 类意图维度唯一有效判官（§4）
    evidence:
      recall: 0.750
      fpr: 0.0
      f1: 0.857
      b_strict: 0.750
    forbidden:
      - mental_math_frame_diff  # §10.1：017/028 口算帧差数值结论失实 → 帧差/亮度一律脚本实算
  J2_glm3:                      # GLM 首/中/尾 3 帧
    role: backup                # R=0.688/F1=0.815，零误报；不进 E10
  J3_omnijev:                   # OmniJev-4B 9 通道校准概率 —— L1 主判
    role: primary
    rule: "flag = any(per_type[p] > thr for p in 8types) or overall > thr"
    thr: 0.71                   # §7 扫描原工作点 0.70：R=1.000 / FPR=0.250 / F1=0.914。
                                # 2026-10-07 重扫→0.71（判官三件套按 JUDGES-RERUN.md 配方重跑后
                                # 概率整体微移，golden_006 frame_freeze=0.7069 以 0.0069 边际
                                # 越过 0.70 致 FPR 4/12=0.3333>准入线 0.30；新数据上扫描
                                # 0.71=唯一保持 R=1.000 且 B_flag 余量最大的点：
                                # R=1.000/FPR=0.250(3/12=010,013,032)/F1=0.9143/B_flag=0.5833，
                                # 013 为 J1 布尔检出与阈无关——见 g01-full-relock.json round2）
    thr_fpr_first: 0.80         # 追求 FPR≤0.1 的工作点：R=0.875 / FPR=0.083 / F1=0.903
    auto_reject_p: 0.90         # §5：P≥0.9 区间 8/8 全对 → 单通道达标直接 auto_reject
    gray_zone: [0.71, 0.90]     # 灰区 → manual_review（人工复核队列，§11.1 人工抽检行；仅文档口径，回放代码不读本键）
    ece_per_type: 0.2209        # §5 校准：两头准中间烂，0.5 默认阈恰在最不可信区（禁回 0.5）
    known_fp_mechanism: "color_shift 通道把电影感调色当偏色（§9）；frame_freeze 通道对静态场景过信"
  J4_visualjev:
    role: deprecated            # §7：任意阈 F1≤0.744 无工作点 → 不进流水线
    evidence: { max_f1: 0.744, fpr_at_0.75: 0.833 }
  J5_videochat3:
    role: cheap_signal          # §11.1 L2：3.3s/clip；仅并入「确认缺陷」方向，不并入「确认干净」方向
    evidence: { recall: 0.312, fpr: 0.0 }
  J6_detectors:
    role: signal_only           # §11.1 L3：修复前只作信号不作否决（级联 FPR 全被它绑架，§6）
    emit_conf: 0.55             # τ 临时上调（0.45→0.55，F1 0.722→0.743，§7 J6 扫描）
    promote_criteria:           # 修复后达此线才可升「否决层」
      recall_min: 0.85
      fpr_max: 0.15
    rule_params:                # 现行规则参数（qc_orch 规则引擎使用；§11.2 修复清单未实施，
      face_drift_cos: 0.30      #   修复后须金标复测 promote_criteria 达标再改此处）
      face_blur_cos: 0.50
      freeze_diff: 1.2
      freeze_ratio: 0.35
      spike_k: 3.0
      swap_sim: 0.75
      flicker_cap: 0.85
      garble_drop: 0.25
      garble_low: 0.78
      garble_ratio: 0.45
      garble_unif: 0.70
      hue_shift_deg: 30.0
      sat_jump: 0.30
    known_broken_rules:         # §11.2 修复清单摘要（证据行号见报告）
      - "freeze: freeze_ratio=0.35 与 8 帧采样几何不匹配 → 真冻结(017/028)零触发、flicker/color 注入条(004/016)误触发"
      - "garble: conf_drop/uniform_low 对手部纹理 7/8 误报（B 类）"
      - "hue_shift: 绝对 30° 阈对 API 调色片误报 conf=1.00（026/032）"
      - "scene_cut: 正常运镜被当 temporal_swap（026/028）"
      - "ghosting/pixelate: 无检测器覆盖（golden_034 空候选）"
  J7_kimi:
    role: not_run               # 金标批未执行（§1.1），无阈值
  J6_detectors_v2:              # 2026-09-30 J6 时序规则 v2（qc_detectors_v2.py，帧序列分析）
    role: signal_only           # 角色不变：修复后作信号层；升否决层仍须金标扩样后复测 promote_criteria
    rule_params:                # 与 src/qc_detectors_v2.py DEFAULT_PARAMS 一致（yaml 为准）
      feat_width: 160
      sim_width: 80
      freeze_diff_thr: 0.8      # 帧差绝对阈（近编码噪声）
      freeze_min_s: 2.0         # 对齐注入参数：定格 2s
      freeze_lap_guard: 0.75    # 冻结段清晰度守卫（排除模糊伪静止）
      flicker_amp_min: 6.0
      flicker_sat_amp_min: 0.08
      flicker_rate_min: 6.0
      flicker_min_s: 1.0
      cut_abs_min: 15.0
      cut_rel_k: 3.5
      reentry_win_s: 0.4
      reentry_gap_s: 0.5
      reentry_margin: 0.05      # 合成正片证据定值（真接缝 0.06-0.11，静态伪切点≈0）
      swap_multi_min_cuts: 2
      swap_multi_back_min: 0.62
      swap_single_back_min: 0.85
      swap_span_s: 3.0
      ghost_dip_ratio: 0.65
      ghost_out_min: 1.2
      ghost_min_s: 1.5          # 对齐 2s 注入窗（R2：消除自然慢速段误报）
      ghost_cut_free: 15.0
      ghost_interior_s: 0.5
      ghost_boundary_ratio: 1.3
      ghost_lap_ratio: 0.85     # lap 支（R3）：线性运动混 blend 的清晰度矩形塌陷
      ghost_lap_out_min: 300.0
      ghost_lap_boundary: 1.15
      ghost_plateau_in_max: 2.0     # 低运动平台：diff 支窗内帧差中位低于此值 ≈ 编码噪声级残余运动
                                    # （实测 9/15 avatar 误报 in_med=0.71-1.64；真混叠 golden_034
                                    #  in_med=0.841/028=0.001 与之交叠——不可作全局豁免阈）
      ghost_plateau_exempt_profiles: [avatar_talk]   # 声明制豁免名单（上游 --profile 才生效）
      known_cuts_tol_s: 0.5         # known_cuts 切点白名单容差（junction cut_t ±tol 不报 swap）
      emit_conf: 0.55
    measured_on_golden:         # 2026-09-30 本机实测（数据/j6_v2/results_r3b/_eval_R3b.json）
      a_temporal_clip_recall: 0.625
      a_temporal_type_macro_recall: 0.25
      c_fpr: 0.0
      label_validity_note: "金标时序 8 条中 5 条注入未生效（017/028 无定格、004/030 无交替、022 无混叠，
        见 数据/j6_v2/audit_notes.json）；合成正片 4/4 检出（数据/j6_v2/results_syn）"

# ---------------------------------------------------------------
# eval_run.py 准入线（本资产验收标准）
# 依据：E10 实测基线（上）定线，不是拍脑袋——
#   recall_min 0.90：E10 实测 1.000，容 1 条漏检（16 条 15/16=0.9375 仍过）；
#   fpr_max   0.30：E10 实测 0.250（3/12），上限压在 4 条误报（0.333 不过）；
#   f1_min    0.85：E10 实测 0.914；
#   b_flag_min 0.50：E10 实测 0.8333，宽松下界（B 类察觉率不得塌方）。
# 注意：准入线回答「本次 qc_orch 实现是否复现基准」；判定阈值在 judges 段，两者勿混。
# ---------------------------------------------------------------
eval_admission:
  recall_min: 0.90
  fpr_max: 0.30
  f1_min: 0.85
  b_flag_min: 0.50
  min_clips_required: 40        # 金标全量（A16/B12/C12），少于即判 eval 无效
  class_counts: { A: 16, B: 12, C: 12 }

# ---------------------------------------------------------------
# L0 确定性预检（§11.1：拒收层。2026-10-01 挂进 qc_orch_v2 在线模式：
#   提供 --clip 即跑，拒收 exit 4 不进 judge；回放模式不检历史片）
# ---------------------------------------------------------------
l0_preflight:
  duration_dev_max: 0.02        # ffprobe 时长 vs spec 偏差 >2% 拒收（default profile）
  black_frame_ratio_max: 0.50   # 黑屏/单色帧占比 >50% 拒收
  sample_frames: 64             # 黑屏/单色检查的均匀采样帧数（确定性）
  black_luma_max: 8.0           # 单帧判「黑」的灰度均值上界（0-255）
  mono_std_max: 2.0             # 单帧判「单色」的像素标准差上界
  avatar_tail_max_s: 1.0        # profile=avatar 时长豁免：允许窗=[expect×(1-dev), ceil(expect)+本值]
                                # （数字人实验报告 §7-4：成片时长=ceil(音频时长)+垫尾不是缺陷；
                                #   实测垫尾 0.4-1.0s，取 1.0 上界）
  avatar_profiles: [avatar_talk]  # 享受垫尾豁免的 profile 声明名单（声明制，与检测器豁免同名）

# =====================================================================
# v4 · CP 级门禁段（2026-10-08 新增；以上 v3 段一字未改，本段只增不改）
# ---------------------------------------------------------------------
# 依据：contracts/v2/checkpoint.schema.json 全部 gate.params_ref 引用 + examples/cp1..12.json
#       实际引用值（schema 红线①：一切判定数值不进契约，一律经 params_ref 引用本文件具名键）。
#       键清单由 schema+examples 全文 grep 盘点：32 处引用 = 24 个 cpN.gate.* 新键 + 8 处既有段
#       引用（l0_preflight.black_frame_ratio_max / duration_dev_max / avatar_tail_max_s、
#       judges.J6_detectors_v2.rule_params.known_cuts_tol_s、ensemble.definitions.E10——均已在上方 v3 段落定，此处不复制数值）。
# 解析口径（v4 修正，2026-10-08 主控验收：原注记误称 J6/ensemble 在文件根，实际不成立）：
#       cpN.gate.* → checkpoints.cpN.gate.*（v4 根命名空间）；l0_preflight.* → 文件根；
#       judges.J6_detectors_v2.rule_params.* → 实际路径（v3 起在 judges 下，主控验收修正）；
#       ensemble.definitions.E10 → 实际路径（E10 是定义名不是可调键）。
# 数值来源：research/2026-10-08/工业化视频流水线-白皮书.md §3 各 CP「客观验收门禁」行 +
#       §4 各 T 层门禁行/成本可信度表；白皮书没有明确数值的键在行内注明「v4 初值，M2 校准」
#       （M2=§6 试跑 W6–W9，校准窗口）。逐键的出处/初值理由/校准计划全量版：
#       evidence/thresholds/v3-to-v4-migration.md。
# 效力：v2 门禁校验器（src/gate/ 包，M1 落地）按本段判 CP 工件；eval_run.py / qc_orch /
#       qc_detectors_v2 不读本段，v3 判定行为零影响（复跑证据见 migration 文档）。
# =====================================================================
checkpoints:
  cp1:                              # CP1 意图单（白皮书 §3 CP1「客观验收门禁」行）
    gate:
      forbidden_defect_code_registry:   # 禁区→已注册缺陷码注册表。schema：defect_code 必须能在
                                        #   thresholds.yaml 查到（注册表不进 schema）；白皮书 CP1：
                                        #   禁区无对应缺陷码→拒收并要求 owner 裁决（全链唯一死胡同）。
                                        #   码表=工程方案v3.md §1.1 G1–G8 边界轴 + SPECS_V2.md §3
                                        #   G7 物体恒存门禁定名；示例 cp1.json 引用 G7/G2 两码。
        G1_手部: 手部解剖失真（融指/断指，golden_021/033）
        G2_画面内文字: 画面内渲染文字必乱（小字/密集必乱 golden_038/005；绕行=后期字牌）
        G3_计数空间: 精确计数失真（8+苹果/40+方块；精确计数绕行分镜改述）
        G4_物理时序: 物理时序失真（篮球刚性丧失；复合计数失败 golden_019）
        G5_多角色一致性: 多角色身份漂移（LTX 三连报 0.82–0.95；多参考注入必须 API）
        G6_运镜: 运镜语义失真（环绕 180° 被渲成画面滚转，语义非精确）
        G7_物体恒存: 物体恒存/参考图一致性（SPECS_V2 §3：食物形变 12.3%→0；白皮书 CP1 映射示例原码）
        G8_风格化: 风格化漂移（G8-35 水墨→彩色工笔）
      owner_confirmation: required      # cp1 示例工件 aux_gates 引用（type=human 工位：owner 确认意图卡，
                                        #   白皮书 §3 谱首段 CP1=设计内人工介入点）。非数值键，取值
                                        #   required=确认环节不可跳过；确认动作本身不设数值阈。
  cp2:                              # CP2 剧本与台词本（白皮书 §3 CP2「客观验收门禁」行）
    gate:
      duration_dev_max: 0.02        # Σ estimated_duration vs 目标集时长偏差 ≤2%（白皮书 §3 CP2 原文；
                                    #   与既有键 l0_preflight.duration_dev_max 同值同单位，但判的是
                                    #   剧本估算层不是成片实测层，各自独立成键）。
      line_shot_ratio:              # 台词条数/预计镜头数比值带 [1.0, 1.5]（白皮书 §3 CP2 原文：
        min: 1.0                    #   「台词过少或过碎都拒」；cp3.gate.shot_line_count_match 是同
        max: 1.5                    #   一约束在分镜侧的等式形式，两侧同源）。
  cp3:                              # CP3 分镜表（白皮书 §3 CP3「客观验收门禁」行）
    gate:
      max_shot_duration_s: 15.0     # 引擎单段时长上限：H3 实测 4–15s（白皮书 §3 CP3 引 VDL_v2_草案 R3；
                                    #   与 schema duration_s.maximum:15 的结构兜底同值，逐通道上限
                                    #   收紧走本键不改契约）。
      word_anchor_valid: true       # 词锚定合法（@{} 引用必须存在于本镜台词内）——布尔强制键，
                                    #   true=违例即拒（AI视频生产流水线方案.md §3.2 校验器七条）。
      shot_line_count_match: true   # 镜头数==CP2 台词条数（白皮书 §3 CP3 门禁行；布尔强制键）。
  cp4:                              # CP4 关键帧（白皮书 §3 CP4 + §4 T1 门禁行，全部程序化零 VLM）
    gate:
      pixel_map_rule: true          # 分辨率/比例符合 CP1 deliverable（白皮书 §3 CP4 门禁行；布尔强制键，
                                    #   对照 deliverable.pixel_map 判等，无独立数值）。
      black_frame_ratio_max: 0.0    # 黑图率=0（白皮书 §3 CP4 原文「黑图率=0（fp16 NaN 是 V100 已知失败
                                    #   模式）」，§4 T1 门禁行同文。静帧比视频 L0 的 0.50 严——单张
                                    #   关键帧黑图没有任何豁免空间）。
      identity_coverage: true       # 在场检测 detected ⊇ expected（白皮书 §3 CP4，DramaClaw 唯一标记色
                                    #   +检出态思路；布尔强制键）。
      identity_cosine_min: 0.60     # ArcFace 跨身份余弦 ≥0.60（白皮书 §3 CP4 引 AI视频生产流水线方案.md
                                    #   表 2-1 统一口径；示例 cp4.json 实测 0.68–0.71 有余量）。
  cp5:                              # CP5 动作脚本（白皮书 §3 CP5「客观验收门禁」行）
    gate:
      pose_frame_max: 72            # 姿态序列帧数上限：MimicMotion 72 帧 @576×1024（白皮书 §3 CP5 引
                                    #   cheap-draft-and-programmatic-tools.md:219；超限走分段+
                                    #   progressive latent fusion，拼接缝登记 known_cuts）。
      frame_time_monotonic: true    # 帧时间单调递增（白皮书 §3 CP5 门禁行；布尔强制键）。
      speech_fullbody_lip_layer: true   # speech=full-body 必须存在独立口型层路径，否则拆镜（白皮书
                                        #   §3 CP5 引 AI视频生产流水线方案.md §3.3；分镜层规避，
                                        #   禁止质检环节自动改景别；布尔强制键）。
  cp6:                              # CP6 时间线与节奏轨（白皮书 §3 CP6「客观验收门禁」行）
    gate:
      duration_conservation_frames: 1   # Σ shot.duration_frames vs total_frames 守恒容差 ±1 帧
                                        #   （白皮书 §3 CP6 原文「Σ shot.duration == 集时长（±1 帧）」）。
      subtitle_align_ms_max: 40     # 字幕段 vs 音轨词级时间偏差 ≤40ms（白皮书 §3 CP6 原文；
                                    #   whisperx SemanticTake 对齐口径，示例 cp6.json 实测 32ms）。
      rhythm_segment_s:             # 节奏段长度 warn 带（白皮书 §3 CP6：无 <0.8s 或 >12s 段落，
        warn_min: 0.8               #   warn-only 起不否决；超限上升人类一次带三个候选方案，
        warn_max: 12.0              #   不自动改）。
  cp7:                              # CP7 草稿视频：无 cp7.gate.* 新键。schema CP7 主门定义原文
                                    #   「全部数值沿既有段 l0_preflight.* 引用（拒收 exit 4 已实装）」，
                                    #   示例 cp7.json 实证只引既有键——为防第二套数值，本 CP 不立新值。
    gate:
      uses_existing_keys:
        - l0_preflight.black_frame_ratio_max   # 黑场/单色占比 ≤50%（cp7 示例主门）
        - l0_preflight.duration_dev_max        # 时长偏差 ≤2%（cp7 示例副门）
                                    # NaN/黑帧与帧率/分辨率两项是布尔/声明符合性（白皮书 §3 CP7
                                    # 「无 NaN/黑帧；帧率/分辨率符合档位声明」），无独立数值阈。
  cp8:                              # CP8 择优（白皮书 §3 CP8，两层不可混：judge_rank 只排序 + 绝对门）
    gate:
      pareto_rule: top1_strict_dominance    # 绝对门规则名：候选集内 top-1 须在硬校验向量上 Pareto 支配
                                            #   （无单项比 top-2 差且总分更低，白皮书 §3 CP8 原文）。
                                            #   值=规则选择符非数值；判据实现归 M1 校验器。
      judge_disagreement_delta: 0.15        # judge 间分歧上升人工阈 δ（白皮书 §3 CP8「judge 间分歧 > δ
                                            #   或与硬校验方向矛盾时看」——δ 未给数值）。v4 初值，M2 校准：
                                            #   初值 0.15 仅由示例 cp8.json 反推下界（panel_disagreement
                                            #   =0.08 未触发上升，故 δ>0.08）；M2 以 judge 分歧实测
                                            #   分布定标。与硬校验方向矛盾=无条件上升，不走本阈。
      retry_max: 2                  # 单镜重试上限 2 次，超限转人工工单并标「结构性困难镜」（白皮书
                                    #   §3 CP8 失败回退行原文；schema structural_difficult 行同）。
                                    # 相对线（judge_rank）键=ensemble.E10（既有段，v3 零改动）：
                                    #   示例 cp8.json aux_gates 引用 ensemble.E10，只决定次序
                                    #   不设绝对通过线（白皮书 CP8 两层不可混）。
  cp9:                              # CP9 终稿渲染（白皮书 §3 CP9 + §4 T4 门禁行）
    gate:
      credit_cap_per_shot: 280      # 单镜积分硬上限：H3-Max 280 积分/条（5s 768P 含音轨）=56 积分/s
                                    #   （白皮书 §4 成本可信度表「仓内实测钱包逐条可对，工程方案v3.md:
                                    #   125」；超限 exit 3，DTO 校验先于扣费零损失；标准档单集预算
                                    #   6720=24 镜×280，白皮书 §4 同表）。示例 cp9.json 实耗=上限=280。
      repro_log_complete: true      # 参数级复现留痕齐备（提交参数+seed+指纹落盘一致；白皮书 §3 CP9
                                    #   门禁行；不做像素级 md5 承诺——owner 明令废止，schema
                                    #   repro_level 行）；布尔强制键，缺任一留痕即拒。
  cp10:                             # CP10 字幕与音轨（白皮书 §3 CP10「客观验收门禁」行）
    gate:
      cer_max: 0.05                 # whisper CER small/medium 双口径 ≤5%（白皮书 §3 CP10 原文；
                                    #   同音字以 pinyin 归一口径分析不凑数，INTENT.md:89；示例
                                    #   cp10.json 实测 small 3.1%/medium 4.2%）。CER 超标优先改分句。
      loudness_lufs_target: -16.0   # 混音响度目标 −16 LUFS（白皮书 §3 CP10 原文；示例 cp10.json
                                    #   实测 −16.0）。判等容差（±LU）白皮书未给——v4 初值按达标
                                    #   即过（示例口径），M2 若出现系统性偏差再立容差带。
                                    # 时长守恒（avatar 线=ceil(音频秒)）沿既有段
                                    #   l0_preflight.avatar_tail_max_s（示例 cp10.json 副门实证）。
  cp11:                             # CP11 合成（白皮书 §3 CP11 + §4 T0 门禁行，CRADLE 六道挂载点）
    gate:
      duration_tol_s: 1.0           # 成片总时长 vs CP6 时间线 ±1s（白皮书 §3 CP11「ffprobe 校验
                                    #   （总时长 ±1s…）」原文；示例 cp11.json 副门）。
      shot_count_match: true        # 切镜数==分镜表镜头数（白皮书 §3 CP11 门禁行；CRADLE 六道之一；
                                    #   布尔强制键，不符退回定位哪一镜多/少切）。
                                    # 另两道沿既有段，不立新值防第二套数值：
                                    #   拼接切点白名单容差=judges.J6_detectors_v2.rule_params.known_cuts_tol_s=0.5
                                    #   （示例 cp11.json 主门实证；不登记则同人物同构图硬切后向重入
                                    #   相似度 0.9784>0.85 必误报 temporal_swap，工程方案v3.1.md:170）；
                                    #   黑场占比=l0_preflight.black_frame_ratio_max=0.50（schema CP11
                                    #   门禁行「黑场占比」）；竖版 1088×1920 与 h264+aac 是 CP1
                                    #   deliverable 的契约校验项，非阈值。
  cp12:                             # CP12 质检与成片（白皮书 §3 CP12「客观验收门禁」行五条 + §6 M2 验收②③）
    gate:
      master_score_min: 70          # 成片绝对门：judge 标定分 ≥70（≙人评 7.0/10 的映射值，白皮书
                                    #   §3 CP12 原文，公式 0.7*mean+0.3*worst 短板惩罚已由 schema
                                    #   const 固化）。锚定未完成（120 片段人评未做）前 70 仅作 warn
                                    #   阈与人工队列排序依据，不作自动放行（白皮书 §7 非目标 8）；
                                    #   M2 校准=完成人评锚定后回填映射值（schema episode_verdict 行）。
      a_group_recall_min: 0.99      # A 组程序规则召回 ≥99%（白皮书 §3 CP12 原文；§6 M2 验收门禁②
                                    #   「规格服从维 A 组召回 ≥99%、误报 ≤1%」同值互证）。
      a_group_fpr_max: 0.01         # A 组误报 ≤1%（同上两处出处）。
      b_group_recall_min: 0.95      # B 组专用小模型召回 ≥95%（白皮书 §3 CP12 原文）。
      b_group_fpr_max: 0.15         # B 组误报 ≤15%（同上；LSE-D 硬门仅特写/近景，全身镜头降
                                    #   warn-only——降档是 profile 逻辑非阈值，归校验器实现）。
      c_group_recall_min: 0.80      # C 组 VLM judge 类内召回 ≥80%（白皮书 §3 CP12 原文；judge 缺陷
                                    #   不允许自动否决，C 组不进 veto_groups）。
      c_group_fpr_max: 0.15         # C 组误报 ≤15%（同上出处）。
      veto_groups: [a_group, b_group]   # 一票否决组名册=A/B（白皮书 §3 CP8「任一 A/B 组否决缺陷存在→
                                        #   候选直接出局」+ CP12「任一镜头存在 A/B 组否决缺陷→成片门
                                        #   直接不通过」；C 只标注、D 恒 warn-only——D 组 warn-only
                                        #   已由 schema d_group.warn_only const:true 固化，非阈值）。
                                        #   与 cp8.veto_defects 同源防两套（schema veto_defects 行）。
      human_escalation_rate_max: 0.20   # 人工上升率 ≤20%（白皮书 §3 CP12 门禁行原文；§6 M2 验收门禁③
                                        #   同值；周复核误杀/漏放并回滚权重=M2 校准机制）。
      retry_round_max: 2            # 成片门重试 ≤2 轮，仍不过→人工工单+标记结构性困难+进金标扩样
                                    #   队列（白皮书 §3 CP12 失败回退行原文「重试 ≤2 轮」）。
