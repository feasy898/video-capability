# =====================================================================
# vpipe 模型分层表（contracts/v2/model_tiers.yaml）
# ---------------------------------------------------------------------
# 唯一来源声明（白皮书 §8 整合铁律 2）：本文件是 VDL v2 engine.channel 枚举
#   的唯一来源。VDL_v2_草案.md §3.2 #4 文档内枚举（local_ltx/local_wan/
#   api_h3max/api_h3，开放扩展）自本文件落地起为历史快照，不再维护；
#   R2 校验规则（api 通道禁 fix_for_iteration / content_fingerprint）以
#   本文件 channel_id 词表为稳定依据。
# 效力：checkpoint.schema.json 的 channel 字段只存本文件 channels[].channel_id；
#   模型名字不进意图层（白皮书 §4 分层纪律 2，VDL not-pattern 实测拒 "Wan2.1"）。
# 修改规程：改本文件（增删通道/改价）= 触发一次「模型分层重扫」（TASK_v4 §2.5），
#   按白皮书 §4 成本数字的可信度分层复算，并在下方 变更记录 追加行。
# =====================================================================
version: "2.0"
updated: "2026-10-08"
source: "research/2026-10-08/工业化视频流水线-白皮书.md §4 模型分层（成本数字的可信度分层表 + T0–T5）"

# 成本可信度三级（白皮书 §4 取证纪律的机读化；未确证不许写成确定值）
cost_confidence_semantics:
  measured: "仓内实跑/实扣留痕，evidence_ref 指向 文件:行号，可复算"
  reported: "白皮书/方案文档转引记录，有出处但本仓未复核"
  unverified: "未确证：不得进任何预算基线，cost_value 只能为 null 或区间（notes 内说明）"

# V100S 兼容判据（2026-10-08 主控验收修正，原判据不成立）：
#   torch 2.7.0 实测 is_bf16_supported()=True（默认 including_emulation=True：
#   major>=8 走快速路径，SM70 落到 _check_bf16_tensor_supported 真算试探，CUDA 12
#   支持 bf16 存储+转换指令、算术上行转换模拟——2026-10-08 GPU 机实测确认）。
#   故 bf16 不是硬出局理由；下列模型的真实硬约束是【显存/速度】：
#   Wan2.2-A14B 官方门槛 ≥80GB、HunyuanVideo-1.5 ≥60GB、Mochi ≥60GB——
#   均超 2×V100S-32GB 且无 NVLink 不可模型切分（显存硬出局）。
#   CogVideoX1.5-5B 改判【待重评】：fp16 转换路径 + ~10GB 权重可入 32GB，
#   速度未实测，不作出局、不进产线（白皮书 §5.3 原「bf16 物理不支持」判据作废）。
# v100s_compatible 语义：可在 owner 2×V100S-32GB（卡1，卡0 绝不占用，INTENT.md:97）
#   硬件上进入产线。API/进程通道不占卡，恒为 true。

tiers:
  # ---------------------------------------------------------------
  - tier_id: T0
    name: "确定性层（零生成成本）"
    purpose: "把想象降维成确定性函数：字幕/花字/排行榜/时长/节奏/混音/转场在 HTML/ffmpeg 里是纯函数，唯一能承诺像素级复现的层。"
    channels:
      - channel_id: proc_ffmpeg
        provider: local
        model: "ffmpeg 子进程 + MoviePy v2"
        licensing: "FFmpeg LGPL/GPL 组件（分发注意构建配置）；MoviePy v2 MIT"
        cost_basis: "每条（¥）"
        cost_value: 0
        cost_confidence: measured
        evidence_ref: "overnight/工程方案v3.1.md:218（dh_final_30s 同参数二遍编码 md5 一致 289f96f3…；¥0 为本地进程结构事实，无计费通道）"
        gate_refs:
          - "cp11.gate.duration_tol_s"
          - "cp11.gate.shot_count_match"
          - "cp11.gate.known_cuts_registered"
        v100s_compatible: true
        notes: "确定性梯度顶端；CRADLE 六道硬校验挂载点（白皮书 §4 T0 门禁行，cheap-draft-and-programmatic-tools.md:371）；像素级回归用例 ≥3 个（M1-W5）。"
      - channel_id: proc_hyperframes
        provider: local
        model: "HyperFrames（HTML data-* + headless Chrome 逐帧 seek + ffmpeg；171 blocks + 223 components）"
        licensing: "Apache 2.0，无 per-render 费用；Remotion 因 LICENSE 禁「copy or modify … for the purpose of selling your own derivate」出局作对外底座（cheap-draft-and-programmatic-tools.md:337）"
        cost_basis: "每条（¥）"
        cost_value: 0
        cost_confidence: measured
        evidence_ref: "research/2026-10-08/hypit-svml-deepdive.md:19,99（字幕/排行榜/B-roll 动效纯 HTML/CSS 组件零调用费，经白皮书 §2 原则一转引）"
        gate_refs:
          - "cp4.gate.black_frame_ratio_max"
          - "cp11.gate.shot_count_match"
        v100s_compatible: true
        notes: "字牌/花字/排行榜/数据可视化；CP4 小字绕行的程序渲染出口（G2 实测小字必乱）。"
      - channel_id: proc_blender
        provider: local
        model: "Blender 无头（blender -b scene.blend -a -s <start> -e <end> -o //out/####）"
        licensing: "GPL-2.0-or-later（Blender 官方）"
        cost_basis: "每条（¥）"
        cost_value: 0
        cost_confidence: measured
        evidence_ref: "本地进程结构事实（无计费通道）；渲染墙钟未确证——白皮书附录 A 显式列为待确证项，不进排产承诺"
        gate_refs:
          - "cp5.gate.pose_frame_max"
        v100s_compatible: true
        notes: "CP5 blocking（16 关节 armature）的确定性渲染出口；mcp-for-blender 只用于人机共驾预演台，不作无人值守批处理唯一入口（白皮书 §7 非目标 7）。"

  # ---------------------------------------------------------------
  - tier_id: T1
    name: "分镜草图 / 关键帧层（本地图像）"
    purpose: "每镜 1–2 张关键帧 + 身份参考图：构图在交给视频模型想象之前先被钉死；CP4 局部返修能力的来源。"
    channels:
      - channel_id: local_vace_1_3b
        provider: local
        model: "VACE-1.3B（参考图注入 + 局部重做，约 16GB@512×512×81）"
        licensing: "Apache-2.0（阿里 VACE）"
        cost_basis: "每张（积分）"
        cost_value: 0
        cost_confidence: reported
        evidence_ref: "白皮书 §4 T1（本地推理结构零积分；墙钟量级待实测——T9 时间盒：GGUF 档黑图率×5 prompts=0 且显存 ≤30GB 才入产线）"
        gate_refs:
          - "cp4.gate.identity_coverage"
          - "cp4.gate.identity_cosine_min"
          - "cp4.gate.black_frame_ratio_max"
        v100s_compatible: true
        notes: "首选：一致性注入与反馈局部重做统一到同一 mask 通道，一条通道两用不重复建设；多参考身份注入必须 API 的实测针对视频层（Wan-1.3B 无 I2V 权重、LTX 仅首帧条件，overnight/工程方案v3.md:36），图像层 VACE 为 CP4 补位。"
      - channel_id: local_qwen_image_edit_2509
        provider: local
        model: "Qwen-Image-Edit-2509（GGUF 量化档）"
        licensing: "Apache-2.0（Qwen 系）；GGUF 量化为社区再分发"
        cost_basis: "每张（积分）"
        cost_value: 0
        cost_confidence: unverified
        evidence_ref: "白皮书 §4 T1 列为备选；本仓无实跑记录，显存/黑图率未经 V100S 实测"
        gate_refs:
          - "cp4.gate.black_frame_ratio_max"
        v100s_compatible: true
        notes: "备选；过 T9 时间盒验收前不进产线排产。"
      - channel_id: local_flux_kontext_dev
        provider: local
        model: "FLUX.1-Kontext dev（12B，fp16 约 24GB 单卡可容）"
        licensing: "FLUX.1 [dev] Non-Commercial License：输出用于个人/科研/评测尚可，商业化（订阅服务）须 BFL 授权——与 owner 终局目标冲突，作对外产品底座前必须换许可（Remotion 教训同构，cheap-draft-and-programmatic-tools.md:337）"
        cost_basis: "每张（积分）"
        cost_value: 0
        cost_confidence: unverified
        evidence_ref: "白皮书 §4 T1 列为备选；本仓无实跑记录"
        gate_refs:
          - "cp4.gate.black_frame_ratio_max"
        v100s_compatible: true
        notes: "仅备选。20B 级编辑器无 NVLink 禁模型切分、无例外（AI视频生产流水线方案.md §2.1 纪律）；12B fp16 单卡可容是入围前提。"

  # ---------------------------------------------------------------
  - tier_id: T2
    name: "廉价草稿视频层（本地 V100S）"
    purpose: "owner 的「廉价本地模型先形成草稿」：480P/16fps 构图动作节奏预演，替精修层挡烂片；它不是交付物。"
    channels:
      - channel_id: local_ltx_2b
        provider: local
        model: "LTX-Video 2B distilled（fp16，8 步）"
        licensing: "开源权重（LTXV 系；具体商用条款以仓库 LICENSE 为准，白皮书未记载，接入商用前补核）"
        cost_basis: "每条（积分）"
        cost_value: 0
        cost_confidence: measured
        evidence_ref: "overnight/工程方案v3.md:35（76.7s/条 15.2× 实时、42/42 全成、0 积分，仓内实跑台账）"
        gate_refs:
          - "l0_preflight.black_frame_ratio_max"
          - "l0_preflight.duration_dev_max"
        v100s_compatible: true
        notes: "首选（★★★★★，owner 已跑通）。480×704/480×832、16fps；LTX fp16 黑帧/NaN → VAE fp32 自动降级重跑（SPEC.md §2.1 实测语义）；只做择优不做 aesthetic 判定；ROI 诚实算法 = 挡掉的镜头数×精修单价 − 本地墙钟，拐点须用真实单价跑（cheap-draft-and-programmatic-tools.md:347）。"
      - channel_id: local_wan22_ti2v_5b
        provider: local
        model: "Wan2.2-TI2V-5B（--convert_model_dtype 降 fp16 + SDPA 兜底）"
        licensing: "Apache-2.0（阿里 Wan）"
        cost_basis: "每条（积分）"
        cost_value: 0
        cost_confidence: measured
        evidence_ref: "AI视频生产流水线方案.md:129（Q8 档 212–214s/33 帧 480×832、23.7GB，仓内实跑）"
        gate_refs:
          - "l0_preflight.black_frame_ratio_max"
          - "l0_preflight.duration_dev_max"
        v100s_compatible: true
        notes: "次选（★★★★☆）。原生 bf16 档在 SM70 不可用（major=7），必须降 fp16；M0-W2 spike 验收门槛：峰值 <30GB + 黑帧率 0 + ≥1 条过全部六门禁，过则产线 480P/16fps 直上 720P/24fps（TASK_v4 §4 M0-W2）；14B 档 V100 ≈7 小时/条流水线不可用（同文件 :129 行）。"
      - channel_id: local_cogvideox_2b
        provider: local
        model: "CogVideoX-2B"
        licensing: "Apache-2.0（THUDM CogVideoX-2B）"
        cost_basis: "每条（积分）"
        cost_value: 0
        cost_confidence: reported
        evidence_ref: "白皮书 §4 T2（唯一官方推荐 FP16、4GB 起；本仓无实跑记录）"
        gate_refs:
          - "l0_preflight.black_frame_ratio_max"
          - "l0_preflight.duration_dev_max"
        v100s_compatible: true
        notes: "兜底。注意 CogVideoX1.5-5B 是另一模型：默认 bf16，出局（见 excluded_channels）。"

  # ---------------------------------------------------------------
  - tier_id: T3
    name: "动作与口播层（本地 + 极便宜 API）"
    purpose: "动作可编程（姿态序列驱动，动作先在确定性层被指定再渲染）+ 口播主体（本体系内最省路径）。"
    channels:
      - channel_id: local_mimicmotion
        provider: local
        model: "MimicMotion（confidence-aware pose guidance + regional loss amplification，72 帧 @576×1024）"
        licensing: "Apache-2.0 含第三方组件例外清单（cheap-draft-and-programmatic-tools.md:226，接入前逐条核对例外）"
        cost_basis: "每条（积分）"
