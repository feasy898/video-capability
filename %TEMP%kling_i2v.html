  <script>
    ; (function () {
      var pathname = window.location.pathname
      var normalizedPath = pathname
      if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
        normalizedPath = normalizedPath.slice(0, -1)
      }
      var canonicalUrl = window.location.origin.replace(/\/+$/, '') + normalizedPath
      var link = document.getElementById('kling-canonical')
      if (!link) {
        link = document.querySelector("link[rel='canonical']")
      }
      if (link) {
        link.href = canonicalUrl.split('?')[0].split('#')[0]
      } else {
        link = document.createElement('link')
        link.id = 'kling-canonical'
        link.rel = 'canonical'
        link.href = canonicalUrl.split('?')[0].split('#')[0]
        document.head.appendChild(link)
      }

      function toTitleText(segment) {
        return segment
          .split(/[-_]+/)
          .filter(Boolean)
          .map(function (word) {
            var lower = word.toLowerCase()
            if (lower === 'api' || lower === 'ai') {
              return word.toUpperCase()
            }
            return word.charAt(0).toUpperCase() + word.slice(1)
          })
          .join(' ')
      }

      function truncateDescription(description) {
        var normalized = description.replace(/\s+/g, ' ').trim()
        if (normalized.length <= 160) {
          return normalized
        }
        var truncated = normalized.slice(0, 159)
        var lastSpaceIndex = truncated.lastIndexOf(' ')
        var text = lastSpaceIndex >= 120 ? truncated.slice(0, lastSpaceIndex) : truncated.replace(/\s+$/, '')
        return text + '…'
      }

      function buildDescription(pathname) {
        var normalizedPath = (pathname || '/document-api').split('?')[0].split('#')[0]
        if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
          normalizedPath = normalizedPath.slice(0, -1)
        }
        var parts = normalizedPath
          .replace(/^\/+/, '')
          .split('/')
          .filter(function (part) {
            return part && part !== 'document-api' && part !== 'new' && part !== 'edit'
          })
          .map(toTitleText)
        var pageName = parts.length ? parts.join(' ') : 'Kling AI API Documentation'
        return truncateDescription(
          'Read the ' +
          pageName +
          ' documentation for Kling AI APIs. Learn request parameters, response formats, usage notes, and integration guidance for AI video and image generation.'
        )
      }

      var metaDescription = document.querySelector("meta[name='description']")
      if (metaDescription) {
        metaDescription.setAttribute('content', buildDescription(window.location.pathname))
      }

      function setMeta(selector, attrs, content) {
        var meta = document.querySelector(selector)
        if (!meta) {
          meta = document.createElement('meta')
          Object.keys(attrs).forEach(function (key) {
            meta.setAttribute(key, attrs[key])
          })
          document.head.appendChild(meta)
        }
        meta.setAttribute('content', content)
      }

      function buildTitle(pathname) {
        var normalizedPath = (pathname || '/document-api').split('?')[0].split('#')[0]
        if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
          normalizedPath = normalizedPath.slice(0, -1)
        }
        var parts = normalizedPath
          .replace(/^\/+/, '')
          .split('/')
          .filter(function (part) {
            return part && part !== 'document-api' && part !== 'new' && part !== 'edit'
          })
          .map(toTitleText)
        return parts.length ? 'Kling AI API ' + parts.join(' ') : 'Kling AI API Documentation'
      }

      function setBreadcrumbJsonLd(pathname, pageName) {
        var origin = window.location.origin.replace(/\/+$/, '')
        var pageUrl = origin + pathname
        var itemListElement = [
          {
            '@type': 'ListItem',
            position: 1,
            name: 'Kling AI',
            item: origin
          },
          {
            '@type': 'ListItem',
            position: 2,
            name: 'API Documentation',
            item: origin + '/document-api'
          }
        ]
        if (pathname !== '/document-api') {
          itemListElement.push({
            '@type': 'ListItem',
            position: 3,
            name: pageName,
            item: pageUrl
          })
        }
        var script = document.getElementById('kling-breadcrumb-jsonld')
        if (!script) {
          script = document.createElement('script')
          script.id = 'kling-breadcrumb-jsonld'
          script.type = 'application/ld+json'
          document.head.appendChild(script)
        }
        script.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'BreadcrumbList',
          '@id': pageUrl + '#breadcrumb',
          itemListElement: itemListElement
        })
      }

      var ogTitle = buildTitle(window.location.pathname)
      var ogDescription = buildDescription(window.location.pathname)
      var ogImage = window.location.origin.replace(/\/+$/, '') + '/logo-180x180.png'
      setMeta('meta[property="og:type"]', { property: 'og:type' }, 'website')
      setMeta('meta[property="og:title"]', { property: 'og:title' }, ogTitle)
      setMeta('meta[property="og:description"]', { property: 'og:description' }, ogDescription)
      setMeta('meta[property="og:image"]', { property: 'og:image' }, ogImage)
      setMeta('meta[property="og:url"]', { property: 'og:url' }, canonicalUrl)
      setMeta('meta[name="twitter:card"]', { name: 'twitter:card' }, 'summary_large_image')
      setMeta('meta[name="twitter:title"]', { name: 'twitter:title' }, ogTitle)
      setMeta('meta[name="twitter:description"]', { name: 'twitter:description' }, ogDescription)
      setMeta('meta[name="twitter:image"]', { name: 'twitter:image' }, ogImage)
      setBreadcrumbJsonLd(normalizedPath, ogTitle)
    })()

  <script>
      ; (function () {
        function toTitleText(segment) {
          return segment
            .split(/[-_]+/)
            .filter(Boolean)
            .map(function (word) {
              if (word.toLowerCase() === 'api' || word.toLowerCase() === 'ai') {
                return word.toUpperCase()
              }
              return word.charAt(0).toUpperCase() + word.slice(1)
            })
            .join(' ')
        }

        function buildSeoH1(pathname) {
          var normalizedPath = (pathname || '/document-api').split('?')[0].split('#')[0]
          if (normalizedPath !== '/' && normalizedPath.endsWith('/')) {
            normalizedPath = normalizedPath.slice(0, -1)
          }

          var parts = normalizedPath
            .replace(/^\/+/, '')
            .split('/')
            .filter(function (part) {
              return part && part !== 'document-api' && part !== 'new' && part !== 'edit'
            })
            .map(toTitleText)

          return parts.length ? 'Kling AI API ' + parts.join(' ') : 'Kling AI API Documentation'
        }

        function updateSeoH1() {
          var heading = document.getElementById('kling-seo-h1')
          if (heading) {
            heading.textContent = buildSeoH1(window.location.pathname)
          }
        }

        updateSeoH1()

        var rawPushState = window.history.pushState
        var rawReplaceState = window.history.replaceState
        window.history.pushState = function () {
          rawPushState.apply(this, arguments)
          updateSeoH1()
        }
        window.history.replaceState = function () {
          rawReplaceState.apply(this, arguments)
          updateSeoH1()
        }
        window.addEventListener('popstate', updateSeoH1)
      })()
  </script>
